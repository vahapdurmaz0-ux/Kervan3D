name: Publish Guya 3D v0.3.11
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v029.yml]
permissions:
  contents: write
concurrency:
  group: release-v029
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and verify signed game
        env:
          SOURCE: https://energy-pixels-infrastructure-son.trycloudflare.com
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --max-time 240 "$SOURCE/game.pck" -o game.pck
          curl --fail --location --retry 5 --max-time 60 "$SOURCE/latest.json" -o latest.json
          echo 'a9d7f222470966d0898017ec7fd75193ee4d06b56da09d72b27cb723f37f6598  game.pck' | sha256sum --check --strict
          echo '8dff4e9f8702a29858e480f8fe09764960123b44706646384f5ae681e07f287a  latest.json' | sha256sum --check --strict
      - name: Download and verify complete installer
        env:
          SOURCE: https://energy-pixels-infrastructure-son.trycloudflare.com
        run: |
          set -euo pipefail
          export SOURCE
          for n in $(seq 0 19); do printf '%02d\n' "$n"; done | xargs -P 3 -I '{}' bash -c 'curl --fail --location --retry 6 --retry-all-errors --max-time 180 "$SOURCE/setup.part{}" -o "setup.part{}"'
          cat setup.part{00..19} > Guya3D-Setup-v0.3.11.exe
          echo '7669d254e0cd9bc68e49d3bf407ec3cba38fab2c517661f603709e5059dd1a92  Guya3D-Setup-v0.3.11.exe' | sha256sum --check --strict
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          - Arka plan güncelleme göstergesi oyun giriş ekranında, ana menü düğmelerinin altında gösterilir.
          - Lobi, Roller, Moda ve oyun içinde güncelleme paneli görünmez.
          - Gerçek indirme yüzdesi/MB bilgisi ve güncelleme hazır durumu korunur; indirme arka planda sürer ve sonraki açılışta uygulanır.
          
          Doğrulama: yerel görüntü ve görünürlük testi yüzde96 indirme, hazır durumu, üç lobi sekmesi ve oyun içini kapsar. Tek dosya kurulumunun çıkarma/bütünlük testi geçti.
          NOTES
          gh release create v0.3.11 game.pck latest.json Guya3D-Setup-v0.3.11.exe --draft --title 'Güya 3D v0.3.11' --notes-file notes.md --target "$GITHUB_SHA"
          gh release edit v0.3.11 --draft=false --latest
