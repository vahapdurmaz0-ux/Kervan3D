name: Publish Guya 3D v0.3.0
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v029.yml]
permissions:
  contents: write
concurrency:
  group: release-v029
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify signed release files
        env:
          SOURCE: https://inputs-stones-smilies-branches.trycloudflare.com
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --max-time 120 "$SOURCE/game.pck" -o game.pck
          curl --fail --location --retry 5 --max-time 60 "$SOURCE/latest.json" -o latest.json
          echo '5970a8a1c331096cbdc3693efd019ba0aceb1a603d09881858e21cbdf7824bd5  game.pck' | sha256sum --check --strict
          echo '7de49502b4a24ed1c51b0e73956425b586d67e55a1799854dd62513902f77c20  latest.json' | sha256sum --check --strict
      - name: Publish verified update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          - Oyunun adı Güya 3D oldu. Ana menü, lobi, rol seçimi ve yan sekmeli ayarlar onaylanan görsel düzenlere göre yenilendi. Şapka ve erkek/kız seçimi Moda sekmesine taşındı.
          - Kullanıcının sağladığı erkek karakterin 65 kemikli gerçek modeli eklendi. Yürüyüş, koşu, saldırı, oturma ve el sallama hareketleri bağlandı; saç oyuncu renginde, köylü kıyafeti sabit. Bıçak modelin sağ elini izler.
          - Köy aynı boyutta kaldı; çevresinde 3D dağlar, kiremitli yeni evler ve büyük sahip tabelaları var. İç mekanlar dış kameraların görüşünden uzaklaştırıldı.
          - Onaylanan 17 yeni rol adı ve figürlü ikonları kullanılıyor. Kışkırtıcı bütün oyun iki hak; Cinci kişi başına bütün oyun bir defa, günlük bir işlem yapar. Rol kılavuzu üç sayfalık kartlarla açıklama ve gerçek hakları gösterir.
          - Üstteki toplu rol şeridi kaldırıldı; oyuncunun kendi rolü solda ikon ve adla gösterilir. İzci seçilen eve gelenlerin renkli izlerini görür. Gece 45+10 düzeni ve gerçek hareket kaydı korunur.
          - Oda değiştirme, taşıma/gece geçişi, ev izni, rol sonuçları ve yeniden katılan kişinin voice ayarlarının temizliği kontrol edildi. Ses kategorileri ve kişi başına ses kontrolleri korunur.
          
          Kontroller: gerçek Godot görüntüleri, imzalı paketin eski başlatıcıyla açılması, 65 kemikli modelin animasyonlu GLB olarak yeniden içe aktarılması, rol/gece/oda testleri ve dört WebSocket istemcisiyle taşıma, gece kaydı, voice veri yönlendirmesi ve oyuncu çıkarma.
          Gerçek mikrofon görüşmesi, 20 insanla yük testi ve tüm ekran kartları denenmedi.
          
          Mevcut Kervan3D.exe başlatıcısını kapatıp yeniden açarak güncellemeyi alın. Önceki kişisel ses ve fare ayarlarınız korunur.
          NOTES
          gh release create v0.3.0 game.pck latest.json --draft --title 'Güya 3D v0.3.0' --notes-file notes.md --target "$GITHUB_SHA"
          gh release edit v0.3.0 --draft=false --latest
