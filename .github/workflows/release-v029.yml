name: Publish Guya 3D v0.3.1
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v029.yml]
permissions:
  contents: write
concurrency:
  group: release-v029
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify signed release files
        env:
          SOURCE: https://rim-cbs-begin-coat.trycloudflare.com
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --max-time 120 "$SOURCE/game.pck" -o game.pck
          curl --fail --location --retry 5 --max-time 60 "$SOURCE/latest.json" -o latest.json
          echo '22d03314889d05b3d3473ab513f97996b786295a9ed83cc2e97c8fa39d073f06  game.pck' | sha256sum --check --strict
          echo '2bcddc9bd85fcb68629b7022686b3636fe45af66752932189ebef272d5ecb924  latest.json' | sha256sum --check --strict
      - name: Publish verified update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          - Kullanıcının verdiği kız GLB modeli eklendi. Hazır iskelet içermeyen modelin 11 kaynak parçası korunarak 13 kemikli iskelet ve omuz/dirsek/diz ağırlıkları oluşturuldu.
          - Yeni modellerde ifadelerin görünmemesine yol açan güncelleme sırası düzeltildi. El salla, dans, gül, şaşır, twerk, eller ileri, eller yukarı ve ninja koşusu iki karaktere de aktarılır.
          - Yeleği kollardan çeken hatalı kemik ağırlıkları düzeltildi. Omuz içi gömlek astarı birleşim açıklıklarını kapatır; kol açıları kafanın içine kapanmayacak şekilde sınırlandırılır. Eğilmelerde ayakların zemine gömülmesi azaltıldı.
          - Kaynak karakter parçaları, geometri ve dokular korunur. Saç seçilen oyuncu renginde, kıyafetler sabittir.
          - Şapka ve bere geçici olarak kaldırıldı. Moda sekmesinde erkek ve kız için ayrı yüzlü seçim ikonları bulunur.
          - Rol ikonlarının kesilmesine ve yan ikondan parçalar taşmasına yol açan atlas kırpma ölçüleri düzeltildi.
          - Ana menü arka planındaki evler oyundaki gibi kare gövdeli, üçgen alınlıklı ve kiremit çatılı hale getirildi.
          
          Kontrol: iki karakterde sekiz ifade, dört animasyon zamanı ve üç bakış açısı; 48 ön/yan/arka görüntünün incelenmesi; bütün kaynak parçaların görünür kalması; yürürken el hareketi ve dansta hareket kilidi. İki model de 13 animasyonlu GLB olarak dışa aktarılıp tekrar içe alındı.
          Erkek/kız karışık dört WebSocket istemcisinde taşıma/itme, gece kaydı, voice veri yönlendirmesi ve oyuncu çıkarma testleri geçti. İmzalı paket eski başlatıcı üzerinden açıldı.
          
          Mevcut başlatıcıyı kapatıp yeniden açarak v0.3.1 güncellemesini alın.
          NOTES
          gh release create v0.3.1 game.pck latest.json --draft --title 'Güya 3D v0.3.1' --notes-file notes.md --target "$GITHUB_SHA"
          gh release edit v0.3.1 --draft=false --latest
