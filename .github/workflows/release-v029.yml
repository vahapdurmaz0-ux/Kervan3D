name: Publish Kervan 3D v0.2.12
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v029.yml]
permissions:
  contents: write
concurrency:
  group: release-v029
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify signed release files
        env:
          SOURCE: https://charlotte-bones-enhancing-serum.trycloudflare.com
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --max-time 120 "$SOURCE/game.pck" -o game.pck
          curl --fail --location --retry 5 --max-time 60 "$SOURCE/latest.json" -o latest.json
          echo 'ba3e5ce8503b9bc3dc0a89f1db734902e7a0dc0eca02883595e6158e1bcdb3d7  game.pck' | sha256sum --check --strict
          echo 'cdb332c897085cc86c1f55bf03339d141429d03ecdd41d47e503623c4e160f22  latest.json' | sha256sum --check --strict
      - name: Publish verified update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          - Adımların bas ağırlıklı tonu daha duyulur, yumuşak pıt tonuna değiştirildi ve seviyesi yükseltildi.
          - Yüksek zemin ve ev katlarında adım sesini kesen yükseklik kontrolü kaldırıldı.
          - Kuş sesi belirgin biçimde kısıldı; aralığı 28–45 saniyeye çıkarıldı.
          
          Gerçek oyun yürüyüşü sırasında ses çıkışı AudioEffectCapture ile ölçüldü; yükseltilmiş zeminde de adımların ses verdiği doğrulandı. Test sesi kullanıcı mikrofonundan kaydedilmez.
          Kervan3D.exe dosyasını kapatıp yeniden açarak v0.2.12 güncellemesini alabilirsiniz.
          NOTES
          gh release create v0.2.12 game.pck latest.json --draft --title 'Kervan 3D v0.2.12' --notes-file notes.md --target "$GITHUB_SHA"
          gh release edit v0.2.12 --draft=false --latest
