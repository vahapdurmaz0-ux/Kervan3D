name: Publish Kervan 3D v0.2.13
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v029.yml]
permissions:
  contents: write
concurrency:
  group: release-v029
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify signed release files
        env:
          SOURCE: https://circulation-challenge-media-outcome.trycloudflare.com
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --max-time 120 "$SOURCE/game.pck" -o game.pck
          curl --fail --location --retry 5 --max-time 60 "$SOURCE/latest.json" -o latest.json
          echo 'e3352f66a331673e96bead71801a12fc8ed27daef0fd482f3af8a687683e27d1  game.pck' | sha256sum --check --strict
          echo '59dee2408b8fb62870e818b92159249e63bd896225fe36b081a22b9fc9d672f1  latest.json' | sha256sum --check --strict
      - name: Publish verified update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          - Oda açmadan köyde gezerken yürüyüş ve koşu sesinin çalışmaması düzeltildi. Kendi adımlarınız artık oda kaydına bağlı değil.
          - Ayarlar, Görüntü ve Ses sekmelerine ayrıldı. Ses bölümünde efektler, müzik, ayak, kuş, kedi ve bıçak için ayrı çizgiler bulunur.
          - Ses kontrolleri başlangıçta yüzde50; ayarlar kaydedilir ve yeniden açılışta korunur. Kategorilerde yüzde100 normal seviyenin iki katına kadar izin verir.
          - Ses-Voice ekranında her oyuncunun Sustur seçeneğinin altında kendi ses çizgisi bulunur. Kişi sesleri yüzde50 başlar; değişiklik yalnız sizin duyduğunuz sesi etkiler.
          - Voice çizgileri düzenli liste yenilenirken kaybolmaz; odadan çıkınca kişi ayarları sıfırlanır.
          
          Oda olmadan gerçek yürüyüş/koşu ses çıkışı, bağımsız ses kısıp açma, kayıt/yeniden yükleme, kişi başına voice gain ve sessize alma, ev/gece/hayalet kanal ayrımı ve arayüz yerleşimi test edildi.
          Kervan3D.exe dosyasını kapatıp yeniden açarak v0.2.13 güncellemesini alın.
          NOTES
          gh release create v0.2.13 game.pck latest.json --draft --title 'Kervan 3D v0.2.13' --notes-file notes.md --target "$GITHUB_SHA"
          gh release edit v0.2.13 --draft=false --latest
