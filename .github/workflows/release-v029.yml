name: Publish Guya 3D v0.3.6
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v029.yml]
permissions:
  contents: write
concurrency:
  group: release-v029
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify release
        env:
          SOURCE: https://contacted-softball-contractor-thin.trycloudflare.com
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --max-time 180 "$SOURCE/game.pck" -o game.pck
          curl --fail --location --retry 5 --max-time 60 "$SOURCE/latest.json" -o latest.json
          curl --fail --location --retry 5 --max-time 180 "$SOURCE/Guya3D-Setup-v0.3.6.exe" -o Guya3D-Setup-v0.3.6.exe
          echo '045f6070d258dbff02513f148c9d6dd6abe54136ea9a7a23f8f51657c28f80ee  game.pck' | sha256sum --check --strict
          echo 'ea56972943b6043de64984c7205052e9f550d3e186adaa1a99297267d2632fac  latest.json' | sha256sum --check --strict
          echo 'f58d5e9b6588d3cf4e5eb91ae2bfb1a11f9667a923a1ca855f6c708b432592ec  Guya3D-Setup-v0.3.6.exe' | sha256sum --check --strict
      - name: Publish update and installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          - Arayüz fontu Nunito ile değiştirildi. Başlık, rol adı, sayaç ve açıklamaların kalınlıkları tutarlı hale getirildi; uygulanmayan değişken font ağırlığı düzeltildi.
          - Moda bölümünde erkek/kız seçenekleri gerçek oyun karakterlerinin portrelerini gösterir. Saç rengi seçildiğinde iki portre de aynı renge güncellenir.
          - Kırmızı oyuncu sayısı ayarındaki mavi bıçak kaldırıldı; kırmızı takım simgesi eklendi.
          - Sürgün ve ölüm bildirimi de aynı font ailesini kullanır; yapay aşırı kalınlaştırma kaldırıldı.
          - v0.3.5 gece akışı korunur: seçim, 10 saniye saldırı, ardından gece içinde 10 saniye kayıt.

          Doğrulama: gerçek Godot arayüzü, Türkçe harfler ve gerçek font ağırlıkları, renk değişiminde iki portre, rol kartları ve 20 kişilik Sürgün yerleşimi; imzalı paket açılışı ve tek kurulum dosyasının bütünlüğü.
          Mevcut kurulum güncellemeyi arka planda indirir; tamamlandıktan sonraki açılışta v0.3.6 uygulanır.
          Yeni kurulum: Guya3D-Setup-v0.3.6.exe.
          NOTES
          gh release create v0.3.6 game.pck latest.json Guya3D-Setup-v0.3.6.exe --draft --title 'Güya 3D v0.3.6' --notes-file notes.md --target "$GITHUB_SHA"
          gh release edit v0.3.6 --draft=false --latest
