name: Publish Kervan 3D v0.2.10
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v029.yml]
permissions:
  contents: write
concurrency:
  group: release-v029
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify signed release files
        env:
          SOURCE: https://assumes-applies-wives-patients.trycloudflare.com
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --max-time 120 "$SOURCE/game.pck" -o game.pck
          curl --fail --location --retry 5 --max-time 60 "$SOURCE/latest.json" -o latest.json
          echo '5dd015501d5a1daeadee460d4628d1bbcc80c1b662c9f063b7848058a4df17d3  game.pck' | sha256sum --check --strict
          echo '57dadf209e4065fe4230ae545274863b001023cf1aa6e94690069c66920f5052  latest.json' | sha256sum --check --strict
      - name: Publish verified update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          - Kuyunun içindeki ipe asılı kova geri getirildi.
          - Duvardaki dış kova ve rafı kaldırıldı.
          
          Oyun içi görüntü ve tek kovanın içeride bulunduğu kontrol edildi.
          Kervan3D.exe dosyasını kapatıp yeniden açarak v0.2.10 güncellemesini alabilirsiniz.
          NOTES
          gh release create v0.2.10 game.pck latest.json --draft --title 'Kervan 3D v0.2.10' --notes-file notes.md --target "$GITHUB_SHA"
          gh release edit v0.2.10 --draft=false --latest
