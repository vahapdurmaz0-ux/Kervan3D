name: Publish Kervan 3D v0.2.11
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v029.yml]
permissions:
  contents: write
concurrency:
  group: release-v029
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify signed release files
        env:
          SOURCE: https://vids-pos-spine-chocolate.trycloudflare.com
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --max-time 120 "$SOURCE/game.pck" -o game.pck
          curl --fail --location --retry 5 --max-time 60 "$SOURCE/latest.json" -o latest.json
          echo '1737d6ed9cffcc04769f95be2a8094f80dcf52242cc942b87598939ada5c666d  game.pck' | sha256sum --check --strict
          echo 'f84ce5e8bf3a4ef96076338496a687d6cc21894e744429a3fbb7920d9f673fad  latest.json' | sha256sum --check --strict
      - name: Publish verified update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          - Sürekli kuş korosu ve ortam uğultusu kaldırıldı.
          - Kuşlar dışarıda gündüz 14–26 saniye arayla kısa cik cik yapar.
          - Yürüyüşe kısa, yumuşak pıt pıt adım sesi eklendi; diğer oyuncular kendi adım sesinizi kesemez.
          - Adımları ve kuşları bastırmayan kısık, sakin enstrümantal müzik eklendi.
          - Kuyuda içerideki asılı kova durur; duvardaki kova ve raf yoktur.
          
          Oyun içinde gerçek yürüyüş, ses düzeyleri, aralıklı kuş ve iç mekan/sessize alma kontrolleri geçti.
          Kervan3D.exe dosyasını kapatıp yeniden açarak v0.2.11 güncellemesini alabilirsiniz.
          NOTES
          gh release create v0.2.11 game.pck latest.json --draft --title 'Kervan 3D v0.2.11' --notes-file notes.md --target "$GITHUB_SHA"
          gh release edit v0.2.11 --draft=false --latest
