name: Publish Guya 3D v0.3.2
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v029.yml]
permissions:
  contents: write
concurrency:
  group: release-v029
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify signed release files
        env:
          SOURCE: https://reservations-ongoing-beverage-proc.trycloudflare.com
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --max-time 120 "$SOURCE/game.pck" -o game.pck
          curl --fail --location --retry 5 --max-time 60 "$SOURCE/latest.json" -o latest.json
          echo 'b42397e7b7cf20e569b82753f93743f79d1525c1db11d1179d4996f2c69125fa  game.pck' | sha256sum --check --strict
          echo 'a5f076e4346616131f448cc979690e638205d8fd8a43106a3ace512c211d05d1  latest.json' | sha256sum --check --strict
      - name: Publish verified update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          - Kuyu çevresine dört sırtlıklı, kolçaklı ahşap bank eklendi. Toplam sekiz oturma yeri var; E ile oturup kalkılır.
          - Banklar alçaltıldı; karakterin oturma noktası öne alınarak kıyafet ve bacakların oturağa gömülmesi düzeltildi.
          - Dolu yere oturma engellenir. Sonradan odaya girenler mevcut oturan oyuncuları ve dolu yerleri doğru görür.
          - Gecikmiş hareket paketlerinin oturma/kalkma işlemini geri almasına yol açan yarış düzeltildi. Lobi geçişleri de konum korumasını kullanır. Uzak oyuncu otururken kamera düğümü bulunmaması hatası giderildi.
          - Röntgencinin kaydı artık ilgili eve bakan en yakın sokak lambasının açısından gösterilir. Görünür kamera modeli yoktur; açı sabittir, ziyaretçiyi tepeden takip etmez.
          - Gerçek son on saniyelik hareket kaydı, ziyaretçi renkleri, yalnız yetkili oyuncuya gönderim ve kendi evinde saldırı olduğunda bölünmüş ekran korunur.
          
          Kontrol: sekiz oturma yeri ve gece temizliği; gerçek üç WebSocket istemcisiyle sonradan katılma, uzaktan oturma ve dolu yer reddi; dört istemcide sosyal etkileşim/gece kaydı/voice veri yönlendirmesi/oyuncu çıkarma; yirmi evde lamba noktası seçimi; gerçek Godot görüntüleri ve eski başlatıcıyla imzalı paket açılışı.
          
          Mevcut başlatıcıyı kapatıp yeniden açarak v0.3.2 güncellemesini alın.
          NOTES
          gh release create v0.3.2 game.pck latest.json --draft --title 'Güya 3D v0.3.2' --notes-file notes.md --target "$GITHUB_SHA"
          gh release edit v0.3.2 --draft=false --latest
