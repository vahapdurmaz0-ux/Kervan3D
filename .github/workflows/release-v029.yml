name: Publish Guya 3D v0.3.8
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v029.yml]
permissions:
  contents: write
concurrency:
  group: release-v029
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify release
        env:
          SOURCE: https://patents-municipality-nodes-equipped.trycloudflare.com
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --max-time 180 "$SOURCE/game.pck" -o game.pck
          curl --fail --location --retry 5 --max-time 60 "$SOURCE/latest.json" -o latest.json
          echo '2be093828a913a5a2d527c02ced1889a776d80564e21fd461dfa68eada02566c  game.pck' | sha256sum --check --strict
          echo '1f3c691c6083fd0c7c8f220c9e0f29cf0771b0982a607643920adddd7ec8c2f9  latest.json' | sha256sum --check --strict
      - name: Publish verified automatic update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          - Sunucuda hareket mesafesi/hızı ve doğrudan duvar geçişi denetlenir; sahte konumlar düzeltilir.
          - Oyuncu ve işlem başına istek sınırları, kayıt süresi ve bozuk veri denetimleri güçlendirildi.
          - Gece saldırı ve yaralanma bilgileri ilgisiz evlere gönderilmez.
          - İnternet bağlantı yardımcısının dosya bütünlüğü çalıştırılmadan doğrulanır.
          - Etkileşim ve tuş ayarlarında renkli simgeler/tuşlar; değiştirilen kısayollar görüntüye yansır.
          - Ana Menü düğmesi lobi sohbetinden uzaklaştırıldı.

          Kontroller: dört WebSocket istemcisiyle saldırgan istekler ve normal hareket, gece saldırısı, kayıt, taşıma, ses kanalları ve kapasite; yerel imzalı paket açılışı ve güncelleyici bütünlük testleri geçti.
          Oda sahibi sunucu olmaya devam eder; bu güncelleme tam hile koruması veya bağımsız güvenlik sertifikası değildir.
          Mevcut başlatıcı güncellemeyi arka planda indirir, sonraki açılışta uygular.
          NOTES
          gh release create v0.3.8 game.pck latest.json --draft --title 'Güya 3D v0.3.8' --notes-file notes.md --target "$GITHUB_SHA"
          gh release edit v0.3.8 --draft=false --latest
