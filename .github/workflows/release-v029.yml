name: Publish Guya 3D v0.3.9
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v029.yml]
permissions:
  contents: write
concurrency:
  group: release-v029
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and verify signed game
        env:
          SOURCE: https://recipe-eugene-daughters-finger.trycloudflare.com
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --max-time 240 "$SOURCE/game.pck" -o game.pck
          curl --fail --location --retry 5 --max-time 60 "$SOURCE/latest.json" -o latest.json
          echo '054cf5720f1d6e2ddf042a444e9ea7164777794f59fb7c5a3a0221ee65dbc296  game.pck' | sha256sum --check --strict
          echo 'e41d434d6c2a74dc0f4077fb5f956309b1359368d987ba41f32ee4ff0c923439  latest.json' | sha256sum --check --strict
      - name: Download and verify complete installer
        env:
          SOURCE: https://recipe-eugene-daughters-finger.trycloudflare.com
        run: |
          set -euo pipefail
          export SOURCE
          for n in $(seq 0 19); do printf '%02d\n' "$n"; done | xargs -P 3 -I '{}' bash -c 'curl --fail --location --retry 6 --retry-all-errors --max-time 180 "$SOURCE/setup.part{}" -o "setup.part{}"'
          cat setup.part{00..19} > Guya3D-Setup-v0.3.9.exe
          echo 'cdc6db61b1400d7ddc1ce321ee9a4508c207d08e20a3675318aabf50ec013a3f  Guya3D-Setup-v0.3.9.exe' | sha256sum --check --strict
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          - Daha canlı, sade lobi/oda/ayar ekranları; eklenen gereksiz başlık ve düğme ikonları kaldırıldı.
          - Lobi sohbeti ve Ana Menü düğmesi çakışmaz. Odaya girince karakter alanı sohbet için küçülür.
          - Ayarlarda Türkçe, İngilizce, Çince (basitleştirilmiş), Almanca, Japonca, Fransızca, İspanyolca, Kırgızca, Moğolca, Kazakça ve Özbekçe seçilebilir. Seçim kaydedilir.
          - Rol açıklamaları, temel menüler, bildirimler ve oynanış metinleri için 10 çeviri kataloğu. Oyuncu adları ve sohbet çevrilmez.
          - Çince/Japonca için Noto CJK yazı tipleri. Çeviriler ilk sürümdür; ana dilde üslup incelemesi henüz yapılmadı.
          - Yeni başlatıcıda dosya doğrulama ve sahne yükleme aşamaları görünür şekilde yüzde100'e ilerler; indirme yüzdesi ve MB değerleri gerçek dosya ilerlemesine bağlıdır.
          - Eski başlatıcıyla oyun güncellemesi alanlara menüde indirme/hazır bilgisi gösterilir.

          Açılış çubuğu düzeltmesi başlatıcıdadır: Guya3D-Setup-v0.3.9.exe ile yeni kurulumu kullanın. Oyun güncellemeleri arka planda indirilir ve sonraki açılışta uygulanır.
          Doğrulama: 11 dilin yerel ekran/glyph testleri, şablon işaretleri, ad/sohbet koruması, dört istemcili gece/saldırı/kayıt akışı, paket bütünlüğü, gömülü başlatıcının yüzde100 ilerlemesi ve tek dosya kurulumunun çıkarma/bütünlük testi geçti.
          NOTES
          gh release create v0.3.9 game.pck latest.json Guya3D-Setup-v0.3.9.exe --draft --title 'Güya 3D v0.3.9' --notes-file notes.md --target "$GITHUB_SHA"
          gh release edit v0.3.9 --draft=false --latest
