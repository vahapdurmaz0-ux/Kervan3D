name: Publish Guya 3D v0.3.13
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v029.yml]
permissions:
  contents: write
concurrency:
  group: release-v029
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and verify signed game
        env:
          SOURCE: https://scanned-footage-cache-lloyd.trycloudflare.com
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --max-time 240 "$SOURCE/game.pck" -o game.pck
          curl --fail --location --retry 5 --max-time 60 "$SOURCE/latest.json" -o latest.json
          echo '5100b1ac90585de2831e25d3f0b6cf4a7f48e51c29b3d7ce32127b0e41fb55de  game.pck' | sha256sum --check --strict
          echo '06c0d8450aa6ae6e186849219692d57af19d6534216e022594e993e55f73eb2e  latest.json' | sha256sum --check --strict
      - name: Download and verify complete installer
        env:
          SOURCE: https://scanned-footage-cache-lloyd.trycloudflare.com
        run: |
          set -euo pipefail
          export SOURCE
          for n in $(seq 0 19); do printf '%02d\n' "$n"; done | xargs -P 3 -I '{}' bash -c 'curl --fail --location --retry 6 --retry-all-errors --max-time 180 "$SOURCE/setup.part{}" -o "setup.part{}"'
          cat setup.part{00..19} > Guya3D-Setup-v0.3.13.exe
          echo '108ae745dd521cc180e729feb7f76e355624398abdb6a887e6aa515e1b88001e  Guya3D-Setup-v0.3.13.exe' | sha256sum --check --strict
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          - İndirme yüzdesi ve MB bilgisi gece giriş ekranındaki ortadaki yükleme kutusuna doğrudan bağlandı.
          - Barın doluluğu gerçek indirme yüzdesiyle eşleştirildi; ayrı menü bildirimi ve yinelenen yüzde satırı kaldırıldı.
          - Güncelleme tamamlanmadan ana menü açılmaz. Doğrulama ve sahne yükleme sırasında bar geriye gitmez.
          
          Doğrulama: yavaşlatılmış gerçek HTTP indirmesinde ortadaki bar, yüzde/MB bilgisi, ekran görüntüsü, indirme boyunca menünün açılmaması ve yüzde100 sonrası geçiş test edildi. Eski0.3.6 başlatıcısında yeni paket/giriş ekranı uyumu ve tek dosya kurulumunun çıkarma/bütünlüğü doğrulandı.
          NOTES
          gh release create v0.3.13 game.pck latest.json Guya3D-Setup-v0.3.13.exe --draft --title 'Güya 3D v0.3.13' --notes-file notes.md --target "$GITHUB_SHA"
          gh release edit v0.3.13 --draft=false --latest
