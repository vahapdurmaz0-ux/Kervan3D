name: Publish Guya 3D v0.3.4
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v029.yml]
permissions:
  contents: write
concurrency:
  group: release-v029
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify signed release files
        env:
          SOURCE: https://hepatitis-impacts-typing-mailed.trycloudflare.com
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --max-time 120 "$SOURCE/game.pck" -o game.pck
          curl --fail --location --retry 5 --max-time 60 "$SOURCE/latest.json" -o latest.json
          echo '88807331396b8bb878f924e89d6e2b42316b2ec823a08cca47dd0fceda3ae6fa  game.pck' | sha256sum --check --strict
          echo '2bcbfa6b765ce42ea3adb27c6c81eb09499410b501593e6588ecd92f3f2def04  latest.json' | sha256sum --check --strict
      - name: Publish verified update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          - Sekiz ifade için karakterin gerçek hareket pozlarından ayrı ikonlar hazırlandı ve ifade çarkına eklendi.
          - Oda listesindeki eski yüzler kaldırıldı. Kartlar artık seçilen erkek/kız karakterin yüzünü, oyuncunun seçtiği saç rengiyle gösterir. Kırk hazır portre kullanılır; ek canlı kamera çalıştırılmaz.
          - Ses-Voice ayrı pencere yerine Görüntü ve Ses ile aynı ayar penceresinde üçüncü sekme oldu.
          - Sesli sohbet açma, tümünü susturma, mikrofon seçme, konuşma tuşu ve konuşma ses seviyesi aynı bölümde toplandı. Oyuncuya özel ses çizgisi Sustur düğmesinin altında kalır.
          - Sekme değiştirildiğinde tuş atama bekleyişi iptal olur; ayarlar kapanınca kontroller doğru geri verilir.
          - Önceki sürümdeki İzci ayak izi kamera takibi ve aynı yükseklikte yol tarafındaki başlangıç açısı bu sürüme dahildir.
          
          Kontrol: gerçek Godot arayüz görüntüleri; kırk portre eşleşmesi, sekiz ifade ikonu, üçüncü sekme yerleşimi, kişi sesi ve konuşma tuşu; dört gerçek WebSocket istemcisiyle voice veri yönlendirmesi; kurallar/arayüz regresyonu; eski başlatıcıyla imzalı paket açılışı.
          
          Mevcut başlatıcıyı kapatıp yeniden açarak v0.3.4 güncellemesini alın.
          NOTES
          gh release create v0.3.4 game.pck latest.json --draft --title 'Güya 3D v0.3.4' --notes-file notes.md --target "$GITHUB_SHA"
          gh release edit v0.3.4 --draft=false --latest
