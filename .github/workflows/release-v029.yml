name: Publish Guya 3D v0.3.3
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v029.yml]
permissions:
  contents: write
concurrency:
  group: release-v029
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify signed release files
        env:
          SOURCE: https://wanted-publications-barn-relocation.trycloudflare.com
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --max-time 120 "$SOURCE/game.pck" -o game.pck
          curl --fail --location --retry 5 --max-time 60 "$SOURCE/latest.json" -o latest.json
          echo '2abda1621b45bacf1e90e4825eb7b82eead242e108b8bdf3c20d2f57d75cabce  game.pck' | sha256sum --check --strict
          echo '94368ffc7d1469be651d4bb6f2cf4f34d26199001ec97e3b369585d0218a6800  latest.json' | sha256sum --check --strict
      - name: Publish verified update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          - İzciye gelen renkli ayak izleri artık gerçek köyün içinde kamera takibiyle sırayla gösterilir. Kamera kayıtlı yolu takip eder; oyuncu yerinden oynatılmaz.
          - İlk açı aynı yükseklikte, evin yol tarafındadır. Başlangıçta çatının izleri kapatması önlenir.
          - Birden fazla ziyaretçinin izleri ayrı ayrı izlenir. Önceki iz, Sonraki iz, Dön ve yeniden açmak için İzler düğmeleri eklendi.
          - Bu gösterim yalnız izleri almaya yetkili oyuncuda, gündüz açılır. Gece saldırı süresini kapatmaz. Oylama, ölüm veya oda/gece değişiminde kapanır; kullanılmayan kamera render edilmez.
          - Röntgencinin sabit lamba kamerasının açısı korunur.
          
          Kontrol: gerçek eğri yolda kamera ilerlemesi, izlerin sırayla belirmesi, çoklu ziyaretçi, kontrolün geri verilmesi, gece/oylama/oda temizliği; 45+10 gece akışı; gerçek WebSocket istemcilerinde sosyal etkileşim, gece kaydı, voice yönlendirmesi ve oyuncu çıkarma; eski başlatıcıyla imzalı güncellemenin açılması. Örnek rota gerçek Godot görüntüsüyle ayrıca incelendi.
          
          Mevcut başlatıcıyı kapatıp yeniden açarak v0.3.3 güncellemesini alın.
          NOTES
          gh release create v0.3.3 game.pck latest.json --draft --title 'Güya 3D v0.3.3' --notes-file notes.md --target "$GITHUB_SHA"
          gh release edit v0.3.3 --draft=false --latest
